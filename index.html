<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TailwindCSS</title>
    <link
      rel="shortcut icon"
      href="https://icons.iconarchive.com/icons/pictogrammers/material/128/tailwind-icon.png"
      type="image/x-icon"
    />
    <!-- cdn tailwindCSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <section
      class="flex flex-col md:flex-row items-center w-full min-h-screen text-cyan-800"
    >
      <!-- la partie gauche -->
      <div class="w-full md:w-1/2 flex justify-center items-center flex-col px-8 py-12 md:py-0 gap-4">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="100"
          height="100"
          fill="currentColor"
          class="bi bi-airplane-fill mb-2"
          viewBox="0 0 16 16"
        >
          <path
            d="M6.428 1.151C6.708.591 7.213 0 8 0s1.292.592 1.572 1.151C9.861 1.73 10 2.431 10 3v3.691l5.17 2.585a1.5 1.5 0 0 1 .83 1.342V12a.5.5 0 0 1-.582.493l-5.507-.918-.375 2.253 1.318 1.318A.5.5 0 0 1 10.5 16h-5a.5.5 0 0 1-.354-.854l1.319-1.318-.376-2.253-5.507.918A.5.5 0 0 1 0 12v-1.382a1.5 1.5 0 0 1 .83-1.342L6 6.691V3c0-.568.14-1.271.428-1.849"
          />
        </svg>
        <h3 class="text-slate-700 border-b-2 border-cyan-200 font-bold text-xl mb-6 ">Connectez-vous</h3>
        <form class="w-full max-w-sm">
          <div class ="flex flex-col mb-6">
            <label for="email" class="text-cyan-700 font-medium">Email:</label>
            <input type="email" placeholder="exemple@gmail.com" id="email"  class="border-2 border-cyan-100 p-2 outline-cyan-300 rounded-lg focus:border-cyan-400 transition"/>
          </div>
          <div class ="flex flex-col mb-6">
            <label for="password" class="text-cyan-700 font-medium">Password:</label>
            <input type="password" id="password" placeholder="*********" class="border-2 border-cyan-100 p-2 outline-cyan-300 rounded-lg focus:border-cyan-400 transition"/>
          </div>
          <button class="w-full bg-cyan-500 text-white font-semibold cursor-pointer py-2 hover:bg-cyan-600 rounded-lg transition duration-200">Submit</button>
        </form>
      </div>
      <!-- la partie droite -->
      <div class="w-full h-80 md:w-1/2 md:h-screen">
        <img
          src="https://images.unsplash.com/photo-1790445952280-bfdeb7ab44c0?w=2000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyM3x8fGVufDB8fHx8fA%3D%3D"
          alt="randonné"
          class="w-full h-full object-cover"
        />
      </div>
    </section>
  </body>
</html>
